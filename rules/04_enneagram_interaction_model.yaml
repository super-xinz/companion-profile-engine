    name: "完美型"
    motivation:
      core_drive: "追求正确、完善和持续提升"
      core_fear: "犯错、不正确、失去道德合理性"
      core_need: "做正确的事并让努力与价值被认可"
    attention:
      focus: ["问题", "缺陷", "标准", "改进空间"]
      information_processing: "分析、比较、评估和判断"
      decision_style: "依据原则、标准和长期正确性"
    expression:
      persona: ["严谨", "负责", "自律", "有原则"]
      emotion_style: "控制情绪，常通过纠正和建议表达不满"
      relationship_style: "重视责任和共同成长，容易承担改善者角色"
    state:
      secure_state: "接纳不完美，表现得灵活且有创造力"
      stress_state: "过度批判、焦虑、对错误高度敏感"
      defense: "反应形成"
    interaction_strategy:
      communication: {entry_point: "明确问题与改进目标", language_style: "清晰、结构化、有依据", response_pattern: "先认可标准，再给优化步骤"}
      motivation: {effective_driver: ["改进", "质量", "长期价值"], avoid_driver: ["否定努力", "随意降低标准"]}
      conflict: {trigger: "标准和责任感被否定", deescalation_method: "先认可责任感，再讨论更灵活有效的调整"}
      trust: {trust_path: ["可靠性", "专业性", "一致性"], relationship_building: "持续兑现并解释依据"}
      companionship: {growth_direction: "允许成长过程中的不完美", long_term_support: "帮助区分重要标准与过度苛责"}
