    explicit_preference_priority: "用户明确偏好高于类型策略"
  confidence_policy:
    user_supplied: 0.80
    external_assessment: 0.85
    expert_confirmed: 0.95
    derived_layers_cap: 0.85
    scene_strategy_cap: 0.75
