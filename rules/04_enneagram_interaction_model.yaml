rule_system_version: "1.1.0"
document_type: "enneagram_interaction_parameter_model"
target_schema: "01_profile_schema.yaml@2.2.0"
language: "zh-CN"
status: "expert_review_required"

purpose:
  definition: "将已确认的九型人格组合转换为可审计的互动参数，不承担人格测评、临床诊断或自动分类。"
  source_documents:
    - "文档01｜九型人格 AI陪伴聊天策略模型总体架构说明 V1.0"
    - "文档02｜初始人格信息 → 九型互动参数接口规范 V1.0"
    - "文档03｜九型人格9大主型参数库 V1.0"
    - "文档04｜九型人格18侧翼修正参数库 V1.0"
    - "文档05｜九型人格54本能叠层修正参数库 V1.0"
    - "文档06｜参数继承与权重模型说明书 V1.0"
    - "文档07｜AI互动策略生成规则说明书 V1.0"
    - "文档08｜SX/SO｜7w6 场景化互动策略验证案例库 V1.0"
  boundaries:
    forbidden:
      - "从MBTI直接映射九型类型"
      - "从生日、数字学或单一行为参数推断九型类型"
      - "从单轮或普通对话自动确认九型身份"
      - "将九型人格用于心理疾病、人格障碍或临床诊断"
      - "使用固定类型话术替代当前消息理解"
    allowed:
      - "接收用户明确声明的九型组合"
      - "接收已授权测评系统或专家确认结果"
      - "将九型结构转换为沟通、激励、冲突、信任和陪伴策略"
      - "在具体场景和当前状态下调整策略"

identity_schema:
  core_type:
    type: "integer"
    allowed: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  wing:
    type: "integer_or_null"
    adjacency:
      1: [9, 2]
      2: [1, 3]
      3: [2, 4]
      4: [3, 5]
      5: [4, 6]
      6: [5, 7]
      7: [6, 8]
      8: [7, 9]
      9: [8, 1]
  instincts:
    allowed: ["SP", "SX", "SO"]
    primary_and_secondary_must_differ: true
  accepted_sources:
    user_supplied: 0.80
    external_assessment: 0.85
    expert_confirmed: 0.95

layer_model:
  identity: ["core_type", "wing", "primary_instinct", "secondary_instinct"]
  motivation: ["core_drive", "core_fear", "core_need"]
  attention: ["focus", "information_processing", "decision_style"]
  expression: ["persona", "emotion_style", "relationship_style"]
  state: ["secure_state", "stress_state", "defense"]
  interaction_strategy: ["communication", "motivation", "conflict", "trust", "companionship"]

weights:
  core_type: 0.45
  primary_instinct: 0.20
  secondary_instinct: 0.10
  wing: 0.15
  dynamic_state: 0.10
  precedence:
    - "safety_policy"
    - "explicit_user_preference"
    - "expert_manual_override"
    - "current_state"
    - "scene_adaptation"
    - "core_type"
    - "primary_instinct"
    - "wing"
    - "secondary_instinct"

core_types:
