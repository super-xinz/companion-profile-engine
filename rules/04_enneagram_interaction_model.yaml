output_adapters:
  prompt:
    inject: ["turn_plan", "scene_adaptation", "profile_parameter_input"]
    forbidden_disclosure: ["九型编号", "画像参数", "内部权重", "置信度", "规则名称"]
  robot:
    safety_gate_required: true
    directives_are_advisory: true
    allowed_channels: ["voice", "expression", "posture"]
    device_actions_default: []
    device_action_policy: "规则模型只给表达建议，不直接执行设备动作；设备能力必须经过独立安全检查和授权。"

maintenance:
  identity_policy:
    default_status: "unassigned"
    dialogue_auto_inference: "forbidden"
    update_requires:
      - "用户明确声明、已授权外部测评或专家确认"
