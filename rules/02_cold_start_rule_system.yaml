dimension_aggregation:
  baseline: 0.5
  formula: >-
    raw_value = 0.5 + sum(signal.polarity * signal.strength *
    normalized_source_weight * mapping_strength * data_quality)
  cold_start_default_clip: [0.15, 0.85]
  single_fragment_max_absolute_effect: 0.06
  same_text_total_effect_cap: 0.10
  conflict_handling:
    rule: "正反证据都保留；使用净影响更新value，使用冲突比例降低confidence。"
    conflict_ratio: "min(positive_weight,negative_weight)/max(total_weight,epsilon)"
  confidence:
    base_reliability: 0.35
    maximum: 0.45
    formula: "min(maximum, base_reliability * coverage * consistency * data_quality)"
    rule: "value与confidence严格分离。"

derived_profile_generation:
  mbti_dimensions:
    ei: "core_traits.extroversion"
    sn: "0.75*openness + 0.25*creativity"
    tf: "core_traits.thinking_ratio"
    jp: "0.75*structure_pref + 0.25*discipline"
    type_label_thresholds:
      low: 0.45
      high: 0.55
      middle: "X or weak tendency"
  behavior_style:
    generation_mode: "scenario_template_selection_plus_parameter_grounding"
    coverage_requirement: "必须生成01 schema中的18个场景。"
    per_scenario_algorithm:
      - "读取该场景default_drivers。"
      - "选取置信度最高且偏离0.5最大的1至3个driver。"
      - "根据driver高/中/低区间选择专家模板。"
      - "把字段、值、置信度写入parameter_refs。"
      - "若所有driver confidence<0.20，生成中性描述并标记uncertain。"
  language_style:
    generation_mode: "trait_to_language_candidate_templates"
    coverage_requirement:
      speaking_style: 6
      humor: 3
      emotion_expression: 4
      typical_utterances: 9
      rare_utterances: 5
    rules:
      - "冷启动生成项origin必须是derived，不得伪称用户实际说过。"
      - "举例只表示表达倾向，不写入用户记忆。"
      - "对话中观察到真实语言后，用03规则逐步替换derived项。"
  portrait:
    coverage_requirement: ["essence", "strengths", "weaknesses", "core_tension", "suitable_roles"]
    algorithm:
      - "按abs(value-0.5)*confidence对17维排序。"
      - "essence使用区分度最高的3至4维。"
      - "strengths从高值及其正向场景表现生成。"
      - "weaknesses从低值或极端高值的代价生成，使用非评判措辞。"
      - "core_tension只能从两个都有依据且方向构成张力的维度生成。"
      - "suitable_roles只描述互动角色，不做职业或人生决定。"

