rule_system_version: "2.0.1-draft"
document_type: "cold_start_rule_system"
target_schema: "01_profile_schema.yaml@2.1.0"
status: "expert_review_required"

objective: >-
  在仅有生日、用户授权及少量可选事实时，生成一份结构完整但明确低置信度的真人画像先验。
  输出必须覆盖原始五人案例的所有画像区域，而不是只返回几个标签。

non_goals:
  - "不证明生日能够科学地决定人格。"
  - "不输出健康、财富、婚姻、命运等确定性预测。"
  - "不把冷启动结果锁定为真实人格。"
  - "不把《3人-数字学标签》中的MBTI猜测覆盖到五份完整画像上。"

input_contract:
  required:
    user_id: "string"
    birth_date: "date"
    consent_profile: "true"
    consent_sensitive_inference: "true"
  optional:
    display_name: "string|null"
    birth_time: "time|null"
    timezone: "string|null"
  reject_when:
    - "生日格式非法、为未来日期或超出产品约定范围"
    - "画像授权为false"
    - "租户未配置可发布的冷启动规则包"

execution_pipeline:
  - id: "CS-P01"
    name: "validate_and_minimize_input"
    operation: "VALIDATE_INPUT"
    output: "validated_input"
  - id: "CS-P02"
    name: "calculate_birth_features"
    operation: "CALL_FEATURE_CALCULATORS"
    output: "birth_analysis"
  - id: "CS-P03"
    name: "retrieve_four_domain_rule_fragments"
    operation: "LOOKUP_RULE_BANK"
    output: "raw_candidate_fragments"
  - id: "CS-P04"
    name: "clean_and_deduplicate_fragments"
    operation: "CLEAN_RULE_FRAGMENTS"
    output: "candidate_evidence"
  - id: "CS-P05"
    name: "extract_generalized_semantic_signals"
    operation: "TEXT_TO_SEMANTIC_SIGNALS"
    output: "semantic_signals"
  - id: "CS-P06"
    name: "map_signals_to_17_core_traits"
    operation: "AGGREGATE_DIMENSION_EVIDENCE"
    output: "core_traits"
  - id: "CS-P07"
    name: "derive_all_source_profile_sections"
    operation: "REBUILD_DERIVED_PROFILE"
    output: "mbti_dimensions+behavior_style+language_style+portrait"
  - id: "CS-P08"
    name: "apply_confidence_and_guardrails"
    operation: "CALIBRATE_COLD_START_CONFIDENCE"
    output: "profile_version_1"

feature_calculators:
  numerology_code:
    interface: "BirthFeatureCalculator.calculate_numerology_code(birth_date)"
    output_pattern: "^[0-9]{4}$"
    implementation_status: "missing_expert_formula"
    rule: >-
      在专家给出可复现公式前，只允许使用显式配置的测试映射；不得根据三个样例自行拟合通用公式。
    golden_test_mappings:
      "1998-12-06": "6318"
      "1989-10-15": "6118"
      "1988-08-09": "9817"
  bazi_features:
    interface: "BirthFeatureCalculator.calculate_bazi(birth_date,birth_time,timezone)"
    outputs:
      - "bazi_text"
      - "day_master"
      - "pattern_name"
      - "strength_label"
      - "relation_markers"
    implementation_status: "pluggable_expert_module"
    missing_birth_time_policy: "仅使用当前专家允许的年月日逻辑，并在source_metadata记录精度限制。"

