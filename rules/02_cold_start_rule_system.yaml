rule_bank_cleaning:
  reject_fragments_when:
    - "text is null or blank"
    - "trim(text) == '42'"
    - "weight == 0"
  deduplication_key: "normalize(text)+domain+semantic_scope"
  duplicate_column_policy: "保留原列序号并重命名为_1/_2，不合并来源。"
  final_summary_policy: >-
    四个领域的最终画像摘要列不得作为运行依赖。原文件仅编码1111有完整摘要，其他大量为空。
  preserved_metadata:
    - "source_sheet"
    - "source_row"
    - "source_column"
    - "raw_weight"
    - "normalized_weight"
    - "rule_pack_version"

semantic_signal_extraction:
  output_shape:
    signal_id: "string"
    polarity: "-1|0|1"
    strength: "0..1"
    scope: "trait|behavior|language|relationship|work|emotion"
    source_fragment_ref: "string"
    rationale: "string"
  requirements:
    - "必须识别否定、转折、条件、频率和内外差异。"
    - "同一文本可以产生多个信号，但总影响受source weight约束。"
    - "无法稳定映射的文本只存candidate_evidence，不改画像。"
  generalized_signal_dictionary:
    social_energy_high:
      cues: ["开朗", "健谈", "爱社交", "爱热闹", "人缘好", "需要人群", "主动表达"]
      effects: { extroversion: 1 }
    social_energy_low:
      cues: ["喜欢独处", "慢热", "话不多", "社交后疲惫", "需要独立空间", "内敛"]
      effects: { extroversion: -1 }
    warmth_high:
      cues: ["温柔", "体贴", "照顾", "愿意倾听", "热心", "让人放松", "重陪伴"]
      effects: { social_warmth: 1, empathy: 1 }
    warmth_low:
      cues: ["冷淡", "疏离", "不体贴", "保持距离", "不愿回应情绪"]
      effects: { social_warmth: -1 }
    assertive_high:
      cues: ["主导", "领导", "拍板", "敢争取", "果断", "直接表达立场"]
      effects: { assertiveness: 1, confidence: 1 }
    assertive_low:
      cues: ["犹豫", "等别人决定", "不敢争取", "回避表态", "优柔寡断"]
      effects: { assertiveness: -1, confidence: -1 }
    impulse_high:
